<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS | Advanced Threat Intelligence</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-color: #020205;
            --panel-bg: rgba(5, 8, 15, 0.75);
            --text-main: #e6edf3;
            --text-muted: #7d8590;
            --primary: #00f0ff;
            --primary-glow: rgba(0, 240, 255, 0.5);
            --danger: #ff0055;
            --danger-glow: rgba(255, 0, 85, 0.6);
            --warning: #ffb800;
            --warning-glow: rgba(255, 184, 0, 0.6);
            --safe: #00ff88;
            --safe-glow: rgba(0, 255, 136, 0.6);
            --border: rgba(0, 240, 255, 0.15);
            --font-head: 'Rajdhani', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-head);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* For mobile browsers */
            padding: 15px;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* =========================================
           BACKGROUND FX
           ========================================= */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .hex-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 20%, rgba(0,0,0,0.85) 80%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="69.28" viewBox="0 0 40 69.28"><path d="M40 17.32L20 5.77L0 17.32v34.64l20 11.55l20-11.55V17.32z" fill="none" stroke="rgba(0,240,255,0.05)" stroke-width="1"/></svg>');
            background-size: 100% 100%, 40px 69.28px;
            z-index: 1;
            pointer-events: none;
            animation: gridPan 20s linear infinite;
        }

        @keyframes gridPan {
            0% { background-position: 0 0; }
            100% { background-position: 0 69.28px; }
        }

        .light-rays {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(0, 240, 255, 0.05) 10deg, transparent 20deg, transparent 180deg, rgba(255, 0, 85, 0.05) 190deg, transparent 200deg);
            animation: rotateRays 30s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes rotateRays {
            100% { transform: rotate(360deg); }
        }

        /* =========================================
           MAIN DASHBOARD (Responsive)
           ========================================= */
        .dashboard {
            background: var(--panel-bg);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 850px;
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.9),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 0 50px rgba(0, 240, 255, 0.05);
            position: relative;
            z-index: 10;
            animation: floatIn 1s cubic-bezier(0.16, 1, 0.3, 1);
            margin: auto;
        }

        @keyframes floatIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .dashboard::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            box-shadow: 0 0 20px var(--primary);
            border-radius: 50%;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--primary-glow), inset 0 0 10px var(--primary-glow);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo svg {
            width: 22px;
            height: 22px;
            fill: var(--primary);
            filter: drop-shadow(0 0 5px var(--primary));
            z-index: 2;
        }

        .logo::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .brand-text h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1;
        }

        .brand-text h1 span {
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .brand-text p {
            font-size: 9px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .sys-status {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--safe);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 136, 0.05);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
            white-space: nowrap;
        }

        .sys-dot {
            width: 6px;
            height: 6px;
            background: var(--safe);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--safe);
            animation: blink 1s infinite alternate;
        }

        /* Input Area */
        .input-section {
            position: relative;
            margin-bottom: 20px;
        }

        .section-label {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .textarea-wrapper {
            position: relative;
            border-radius: 12px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), transparent 50%, rgba(255, 0, 85, 0.3));
        }

        textarea {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 10px;
            padding: 15px;
            color: var(--primary);
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
            resize: vertical; /* Allow manual resize on mobile if needed */
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        }

        textarea::placeholder {
            color: rgba(0, 240, 255, 0.2);
        }

        textarea:focus {
            background: rgba(0, 0, 0, 0.8);
        }

        /* Scan Button */
        .scan-btn {
            width: 100%;
            padding: 16px;
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 10px;
            font-family: var(--font-head);
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1), inset 0 0 20px rgba(0, 240, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .scan-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .scan-btn:hover::before {
            left: 100%;
        }

        .scan-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 40px var(--primary-glow), inset 0 0 30px rgba(0, 240, 255, 0.2);
            text-shadow: 0 0 10px var(--primary);
        }

        .scan-btn:active { transform: scale(0.98); }

        .scan-btn.loading {
            pointer-events: none;
            border-color: #333;
            color: #555;
            box-shadow: none;
            text-shadow: none;
            background: transparent;
        }

        .loader {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 240, 255, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading .loader { display: block; }
        .loading .btn-text { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* =========================================
           RESULT TERMINAL (Responsive)
           ========================================= */
        .result-terminal {
            margin-top: 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #05080f;
            display: none;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .result-terminal.show {
            display: block;
            animation: slideUpFade 0.5s ease-out forwards;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .term-header {
            background: #0a0f18;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #1a2332;
        }

        .term-dots { display: flex; gap: 6px; }
        .term-dots div { width: 10px; height: 10px; border-radius: 50%; }
        .t-red { background: #ff5f56; box-shadow: 0 0 8px #ff5f56; }
        .t-yellow { background: #ffbd2e; box-shadow: 0 0 8px #ffbd2e; }
        .t-green { background: #27c93f; box-shadow: 0 0 8px #27c93f; }

        .term-title {
            margin-left: 12px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: #5c6a7a;
        }

        .term-body {
            padding: 20px;
            display: flex;
            gap: 25px;
            font-family: var(--font-mono);
            flex-wrap: wrap; /* Allows wrapping on small screens */
        }

        /* Radar UI */
        .radar-wrapper {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto; /* Center on mobile */
        }

        .radar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: conic-gradient(var(--primary) 0%, transparent 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background 1s ease-out;
            box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
        }

        .radar::before {
            content: '';
            position: absolute;
            width: 84px;
            height: 84px;
            background: #05080f;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .radar-value {
            position: relative;
            font-size: 26px;
            font-weight: 700;
            font-family: var(--font-head);
            color: var(--text-main);
            text-shadow: 0 0 10px currentColor;
        }

        .radar-label {
            margin-top: 8px;
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Logs Area */
        .logs-wrapper {
            flex-grow: 1;
            flex-basis: 200px; /* Allows it to take full width on mobile */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .threat-status {
            margin-bottom: 12px;
            text-align: center; /* Center text on mobile */
        }

        .threat-status h2 {
            font-family: var(--font-head);
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .threat-status p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .log-container {
            max-height: 120px;
            overflow-y: auto;
            padding-right: 5px;
            border-top: 1px dashed #1a2332;
            padding-top: 10px;
            text-align: left;
        }

        .log-container::-webkit-scrollbar { width: 3px; }
        .log-container::-webkit-scrollbar-thumb { background: #1a2332; border-radius: 4px; }

        .log-line {
            color: #8b949e;
            margin-bottom: 6px;
            font-size: 11px;
            opacity: 0;
            animation: typeIn 0.3s forwards;
            display: flex;
            gap: 8px;
        }

        .log-line::before {
            content: '>';
            color: var(--primary);
        }

        @keyframes typeIn { to { opacity: 1; } }

        .log-line b { color: var(--text-main); }

        /* Dynamic Themes */
        .high-risk { --primary: var(--danger); --primary-glow: var(--danger-glow); }
        .med-risk { --primary: var(--warning); --primary-glow: var(--warning-glow); }
        .safe-risk { --primary: var(--safe); --primary-glow: var(--safe-glow); }

        /* =========================================
           RESPONSIVE MEDIA QUERIES (MOBILE)
           ========================================= */
        @media (max-width: 600px) {
            body {
                padding: 10px;
                align-items: flex-start; /* Prevents cutting off content on small screens */
                padding-top: 20px;
                padding-bottom: 20px;
            }

            .dashboard {
                padding: 20px;
                border-radius: 12px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .sys-status {
                align-self: flex-end;
                margin-top: -30px; /* Moves it up slightly to save space */
            }

            .brand-text h1 { font-size: 18px; }
            .brand-text p { font-size: 8px; }

            textarea {
                height: 130px;
                font-size: 12px;
            }

            .scan-btn {
                font-size: 14px;
                padding: 14px;
                letter-spacing: 1px;
            }

            .term-body {
                flex-direction: column;
                gap: 15px;
            }

            .threat-status { text-align: center; }
            .threat-status h2 { font-size: 18px; }

            /* Make sure the input is easily clickable on mobile */
            input, textarea, button {
                font-size: 16px; /* Prevents iOS zoom on focus */
            }
        }
    </style>
</head>
<body>

    <!-- Background Layers -->
    <div class="light-rays"></div>
    <div class="hex-grid"></div>
    <canvas id="bgCanvas"></canvas>

    <!-- Main Dashboard -->
    <div class="dashboard" id="dashboard">
        
        <div class="header">
            <div class="brand">
                <div class="logo">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </div>
                <div class="brand-text">
                    <h1>NEXUS <span>INTEL</span></h1>
                    <p>ADVANCED THREAT INTELLIGENCE SYSTEM</p>
                </div>
            </div>
            <div class="sys-status">
                <div class="sys-dot"></div>
                SECURE
            </div>
        </div>

        <div class="input-section">
            <div class="section-label">
                <label>PAYLOAD INPUT // ANALYZE</label>
                <span>AES-256</span>
            </div>
            <div class="textarea-wrapper">
                <textarea id="messageInput" placeholder="Paste suspicious message, email, or URL here for deep heuristic analysis..."></textarea>
            </div>
        </div>

        <button class="scan-btn" id="scanBtn" onclick="runDeepScan()">
            <div class="loader"></div>
            <span class="btn-text">INITIATE DEEP SCAN</span>
        </button>

        <!-- Results Terminal -->
        <div class="result-terminal" id="resultTerminal">
            <div class="term-header">
                <div class="term-dots">
                    <div class="t-red"></div>
                    <div class="t-yellow"></div>
                    <div class="t-green"></div>
                </div>
                <div class="term-title">nexus_analysis_output.log</div>
            </div>
            <div class="term-body">
                <div class="radar-wrapper">
                    <div class="radar" id="radar">
                        <div class="radar-value" id="radarValue">0%</div>
                    </div>
                    <div class="radar-label">THREAT LEVEL</div>
                </div>
                <div class="logs-wrapper">
                    <div class="threat-status">
                        <h2 id="threatTitle">STANDBY</h2>
                        <p id="threatDesc">Awaiting input parameters...</p>
                    </div>
                    <div class="log-container" id="logContainer"></div>
                </div>
            </div>
        </div>

    </div>

<script>
    /* =========================================
       1. INTERACTIVE 3D PARTICLE GLOBE
       ========================================= */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let angle = 0;
    let mouse = { x: null, y: null };

    // Handle mobile touch events for the globe
    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initGlobe();
    });

    window.addEventListener('mousemove', (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
    });

    window.addEventListener('touchmove', (e) => {
        if(e.touches.length > 0) {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }
    }, { passive: true });

    window.addEventListener('touchend', () => {
        mouse.x = null;
        mouse.y = null;
    });

    class GlobeParticle {
        constructor(theta, phi) {
            this.theta = theta;
            this.phi = phi;
            // Responsive radius based on screen size
            this.baseRadius = Math.min(width, height) * (width < 600 ? 0.45 : 0.4); 
            this.size = Math.random() * 1.5 + 0.5;
        }
        draw() {
            let x3d = this.baseRadius * Math.sin(this.phi) * Math.cos(this.theta);
            let y3d = this.baseRadius * Math.sin(this.phi) * Math.sin(this.theta);
            let z3d = this.baseRadius * Math.cos(this.phi);

            let rotatedX = x3d * Math.cos(angle) - z3d * Math.sin(angle);
            let rotatedZ = x3d * Math.sin(angle) + z3d * Math.cos(angle);

            let perspective = 600 / (600 + rotatedZ);
            let x2d = rotatedX * perspective + width / 2;
            let y2d = y3d * perspective + height / 2;

            let opacity = Math.max(0.05, (rotatedZ + this.baseRadius) / (this.baseRadius * 2));

            ctx.fillStyle = `rgba(0, 240, 255, ${opacity * 0.8})`;
            ctx.beginPath();
            ctx.arc(x2d, y2d, this.size * perspective, 0, Math.PI * 2);
            ctx.fill();

            this.x2d = x2d;
            this.y2d = y2d;
            this.opacity = opacity;
        }
    }

    function initGlobe() {
        particles = [];
        // Reduce particle count on mobile for performance
        const numParticles = width < 600 ? 250 : 500; 
        for (let i = 0; i < numParticles; i++) {
            let theta = Math.random() * Math.PI * 2;
            let phi = Math.acos((Math.random() * 2) - 1);
            particles.push(new GlobeParticle(theta, phi));
        }
    }

    function animateGlobe() {
        ctx.clearRect(0, 0, width, height);
        angle += 0.004;

        particles.forEach(p => p.draw());

        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                let p1 = particles[i];
                let p2 = particles[j];
                
                if(p1.x2d && p2.x2d) {
                    let dx = p1.x2d - p2.x2d;
                    let dy = p1.y2d - p2.y2d;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    // Responsive line distance
                    if (dist < (width < 600 ? 30 : 40)) {
                        let mouseDist = 9999;
                        if (mouse.x) {
                            let mdx = p1.x2d - mouse.x;
                            let mdy = p1.y2d - mouse.y;
                            mouseDist = Math.sqrt(mdx*mdx + mdy*mdy);
                        }

                        if (mouseDist > 100) {
                            let avgOpacity = (p1.opacity + p2.opacity) / 2;
                            ctx.strokeStyle = `rgba(0, 240, 255, ${avgOpacity * 0.2})`;
                            ctx.lineWidth = 0.6;
                            ctx.beginPath();
                            ctx.moveTo(p1.x2d, p1.y2d);
                            ctx.lineTo(p2.x2d, p2.y2d);
                            ctx.stroke();
                        }
                    }
                }
            }
        }
        requestAnimationFrame(animateGlobe);
    }

    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initGlobe();
    animateGlobe();


    /* =========================================
       2. THREAT SCANNING ENGINE
       ========================================= */
    const scamKeywords = [
        "lottery", "winner", "prize", "free", "click here", "urgent", 
        "bank account", "otp", "password", "verify", "suspend", 
        "crore", "lakh", "gift", "kbc", "paytm", "transfer", "blocked",
        "claim now", "limited time", "act now", "crypto", "bitcoin", 
        "investment", "guaranteed return", "double your money", "wire transfer"
    ];

    const fakeNewsKeywords = [
        "forward this", "share with 10 people", "breaking news", 
        "doctors say", "miracle cure", "government announced", 
        "free data", "viral", "alert", "warning", "conspiracy",
        "secret", "they don't want you to know", "banned", "cure for"
    ];

    function runDeepScan() {
        const input = document.getElementById('messageInput').value;
        const scanBtn = document.getElementById('scanBtn');
        const terminal = document.getElementById('resultTerminal');
        const dashboard = document.getElementById('dashboard');
        
        if (input.trim() === "") {
            alert("ERROR: Input payload cannot be empty.");
            return;
        }

        terminal.classList.remove('show');
        dashboard.classList.remove('high-risk', 'med-risk', 'safe-risk');
        scanBtn.classList.add('loading');
        
        setTimeout(() => {
            let score = 0;
            let logs = [];
            const lowerInput = input.toLowerCase();

            logs.push("Booting NEXUS heuristic engine...");
            logs.push("Analyzing payload syntax and structure...");

            let keywordHits = 0;
            scamKeywords.forEach(word => {
                if (lowerInput.includes(word)) {
                    score += 15;
                    keywordHits++;
                    logs.push(`Scam signature matched: <b>"${word}"</b>`);
                }
            });

            fakeNewsKeywords.forEach(word => {
                if (lowerInput.includes(word)) {
                    score += 10;
                    logs.push(`Fake news pattern matched: <b>"${word}"</b>`);
                }
            });

            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const urls = input.match(urlRegex);
            if (urls) {
                score += 20;
                logs.push(`Extracted ${urls.length} URL(s) from payload.`);
                urls.forEach(url => {
                    if(url.includes('.xyz') || url.includes('.top') || url.includes('bit.ly')) {
                        score += 25;
                        logs.push(`CRITICAL: Blacklisted domain detected: <b>${url}</b>`);
                    }
                });
            }

            const capsCount = (input.match(/[A-Z]/g) || []).length;
            if (input.length > 20 && (capsCount / input.length) > 0.4) {
                score += 15;
                logs.push("Heuristic Flag: Aggressive CAPITALIZATION detected.");
            }

            let finalScore = Math.min(score, 100);

            scanBtn.classList.remove('loading');
            terminal.classList.add('show');
            
            const radar = document.getElementById('radar');
            const radarValue = document.getElementById('radarValue');
            const threatTitle = document.getElementById('threatTitle');
            const threatDesc = document.getElementById('threatDesc');
            const logContainer = document.getElementById('logContainer');

            let currentScore = 0;
            let counterInterval = setInterval(() => {
                if (currentScore >= finalScore) {
                    clearInterval(counterInterval);
                } else {
                    currentScore += 2;
                    if (currentScore > finalScore) currentScore = finalScore;
                    radarValue.innerText = currentScore + "%";
                    radar.style.background = `conic-gradient(var(--primary) ${currentScore}%, transparent ${currentScore}%)`;
                }
            }, 20);

            if (finalScore >= 60) {
                dashboard.classList.add('high-risk');
                threatTitle.innerText = "CRITICAL THREAT";
                threatDesc.innerText = "High probability of malicious intent. Do not interact.";
            } else if (finalScore >= 30) {
                dashboard.classList.add('med-risk');
                threatTitle.innerText = "SUSPICIOUS PAYLOAD";
                threatDesc.innerText = "Multiple anomalies detected. Proceed with caution.";
            } else {
                dashboard.classList.add('safe-risk');
                threatTitle.innerText = "CLEAN PAYLOAD";
                threatDesc.innerText = "No known threat signatures identified.";
            }

            logContainer.innerHTML = '';
            let logDelay = 0;
            logs.forEach(log => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'log-line';
                    div.innerHTML = log;
                    logContainer.appendChild(div);
                    logContainer.scrollTop = logContainer.scrollHeight;
                }, logDelay);
                logDelay += 250;
            });

        }, 1800); 
    }
</script>
